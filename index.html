<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ゆうとの気持ちつかみますゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #fdf6e2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
      touch-action: manipulation;
    }
    .card {
      background: #ffffff;
      width: 92%;
      max-width: 360px;
      padding: 28px 20px;
      border-radius: 24px;
      border: 3px solid #222;
      box-shadow: 0 8px 0 #222;
      text-align: center;
    }
    .sub-badge {
      display: inline-block;
      background: #ff4d6d;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 10px;
      border: 2px solid #222;
    }
    h1 {
      font-size: 1.3rem;
      line-height: 1.4;
      margin-bottom: 8px;
      color: #222;
    }
    p.desc {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .timer-display {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ff4d6d;
      margin-bottom: 10px;
      height: 30px;
    }
    .count-display {
      font-size: 0.9rem;
      font-weight: bold;
      color: #444;
      margin-bottom: 8px;
    }
    .meter-container {
      width: 100%;
      height: 26px;
      background: #eee;
      border-radius: 13px;
      border: 2px solid #222;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff758c, #ff4d6d);
      transition: width 0.08s ease;
    }
    .tap-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #ff4d6d;
      border: 3px solid #222;
      box-shadow: 0 6px 0 #222;
      font-size: 3.4rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tap-btn:active, .tap-btn.pressed {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #222;
    }
    .hint-text {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #888;
      font-weight: bold;
    }

    /* 結果モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-card {
      background: #fff;
      padding: 28px 20px;
      border-radius: 20px;
      border: 3px solid #222;
      box-shadow: 0 8px 0 #222;
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
    .result-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 99px;
      background: #ffe3e8;
      color: #ff4d6d;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .time-record {
      font-size: 1.05rem;
      color: #555;
      margin-bottom: 16px;
    }
    .time-record span {
      font-weight: bold;
      color: #222;
      font-size: 1.4rem;
    }
    .message-box {
      background: #fafafa;
      border: 2px dashed #ff4d6d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .msg-text {
      font-size: 1.3rem;
      font-weight: bold;
      color: #222;
      margin-bottom: 8px;
    }
    .reward-text {
      font-size: 1.1rem;
      color: #ff4d6d;
      font-weight: bold;
    }
    .close-btn {
      background: #222;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 99px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="sub-badge">✨ ゆいちゃん限定チャレンジ ✨</div>
    <h1>ゆうとの気持ち<br>つかみますゲーム</h1>
    <p class="desc">ハートを本気で連打して満タンにせよ！<br>クリアした速さでご褒美が変わるで！</p>

    <div class="timer-display" id="timerDisplay">READY...</div>
    <div class="count-display" id="countDisplay">残り 15 タップ！</div>

    <div class="meter-container">
      <div class="meter-bar" id="meter"></div>
    </div>

    <!-- タッチでもクリックでも確実に動くボタン -->
    <button type="button" class="tap-btn" id="tapButton" onclick="handleTap()">❤️</button>

    <div class="hint-text">▲ ここを連打！！ ▲</div>
  </div>

  <!-- 結果モーダル -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="result-badge" id="rankBadge">RANK S</div>
      <div class="time-record">クリアタイム: <span id="finalTime">0.00</span>秒</div>
      
      <div class="message-box">
        <div class="msg-text" id="resultMessage">メッセージ</div>
        <div class="reward-text" id="rewardMessage">🎁 ご褒美: ○○</div>
      </div>

      <button type="button" class="close-btn" onclick="resetGame()">もう1回挑戦する</button>
    </div>
  </div>

  <script>
    var TARGET_TAPS = 15;
    var currentTaps = 0;
    var startTime = 0;
    var timerInterval = null;
    var isFinished = false;

    function handleTap() {
      if (isFinished) return;

      // 初回タップでタイマースタート
      if (currentTaps === 0) {
        startTime = Date.now();
        timerInterval = setInterval(function() {
          var elapsed = (Date.now() - startTime) / 1000;
          document.getElementById('timerDisplay').textContent = elapsed.toFixed(2) + '秒';
        }, 40);
      }

      currentTaps++;
      var remaining = Math.max(TARGET_TAPS - currentTaps, 0);
      document.getElementById('countDisplay').textContent = '残り ' + remaining + ' タップ！';

      var percent = Math.min((currentTaps / TARGET_TAPS) * 100, 100);
      document.getElementById('meter').style.width = percent + '%';

      // クリア判定
      if (currentTaps >= TARGET_TAPS) {
        isFinished = true;
        clearInterval(timerInterval);
        var totalTime = (Date.now() - startTime) / 1000;
        document.getElementById('timerDisplay').textContent = totalTime.toFixed(2) + '秒';
        document.getElementById('countDisplay').textContent = '満タン達成！！🎉';

        var rank = '';
        var msg = '';
        var reward = '';

        if (totalTime < 3.2) {
          rank = 'RANK SSS 🔥';
          msg = '特別やで';
          reward = '🎁 ご褒美: 添い寝';
        } else if (totalTime < 5.5) {
          rank = 'RANK S ✨';
          msg = 'こっちこいよ';
          reward = '🎁 ご褒美: ハグ';
        } else {
          rank = 'RANK A 👍';
          msg = 'よく頑張ったね！';
          reward = '🎁 ご褒美: ナデナデ';
        }

        document.getElementById('rankBadge').textContent = rank;
        document.getElementById('finalTime').textContent = totalTime.toFixed(2);
        document.getElementById('resultMessage').textContent = msg;
        document.getElementById('rewardMessage').textContent = reward;

        setTimeout(function() {
          document.getElementById('modal').style.display = 'flex';
        }, 150);
      }
    }

    function resetGame() {
      currentTaps = 0;
      startTime = 0;
      isFinished = false;
      clearInterval(timerInterval);
      document.getElementById('timerDisplay').textContent = 'READY...';
      document.getElementById('countDisplay').textContent = '残り ' + TARGET_TAPS + ' タップ！';
      document.getElementById('meter').style.width = '0%';
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
