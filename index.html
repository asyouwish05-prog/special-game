<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Special Mini Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #fdf6e2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }
    .card {
      background: #ffffff;
      width: 90%;
      max-width: 360px;
      padding: 28px 20px;
      border-radius: 24px;
      border: 3px solid #222;
      box-shadow: 0 8px 0 #222;
      text-align: center;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    p.desc {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 24px;
    }
    .meter-container {
      width: 100%;
      height: 24px;
      background: #eee;
      border-radius: 12px;
      border: 2px solid #222;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff758c, #ff4d6d);
      transition: width 0.1s ease;
    }
    .tap-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #ff4d6d;
      border: 3px solid #222;
      box-shadow: 0 6px 0 #222;
      font-size: 3rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s, box-shadow 0.05s;
      outline: none;
    }
    .tap-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #222;
    }
    /* モーダル（クリア画面） */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-card {
      background: #fff;
      padding: 30px 20px;
      border-radius: 20px;
      border: 3px solid #222;
      box-shadow: 0 8px 0 #222;
      text-align: center;
      animation: popIn 0.3s ease;
      max-width: 320px;
      width: 100%;
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-card h2 {
      color: #ff4d6d;
      margin-bottom: 12px;
    }
    .modal-card p {
      font-size: 1rem;
      line-height: 1.6;
      color: #333;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }
    .close-btn {
      background: #222;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 99px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>ハートを連打して満タンにせよ！</h1>
    <p class="desc">10回タップでゲージをいっぱいにしてみてね</p>

    <div class="meter-container">
      <div class="meter-bar" id="meter"></div>
    </div>

    <button class="tap-btn" id="tapButton">❤️</button>
  </div>

  <!-- クリア時のポップアップ -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <h2>CLEAR!! 🎉</h2>
      <!-- ここにゆいちゃん向けのメッセージを入れる -->
      <p id="secretMessage">いつもありがとう！
クリアおめでとう。今度美味しいものでも食べに行こう！</p>
      <button class="close-btn" onclick="location.reload()">もう1回遊ぶ</button>
    </div>
  </div>

  <script>
    const TARGET_TAPS = 10; // クリアに必要なタップ回数
    let currentTaps = 0;

    const tapButton = document.getElementById('tapButton');
    const meter = document.getElementById('meter');
    const modal = document.getElementById('modal');

    tapButton.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (currentTaps < TARGET_TAPS) {
        currentTaps++;
        const percent = (currentTaps / TARGET_TAPS) * 100;
        meter.style.width = percent + '%';

        if (currentTaps >= TARGET_TAPS) {
          setTimeout(() => {
            modal.style.display = 'flex';
          }, 200);
        }
      }
    });
  </script>
</body>
</html>
