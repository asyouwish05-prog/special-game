<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ゆうとの気持ちつかみますゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #fdf6e2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
      touch-action: manipulation;
    }
    .card {
      background: #ffffff;
      width: 92%;
      max-width: 360px;
      padding: 24px 20px 28px;
      border-radius: 24px;
      border: 3px solid #222;
      box-shadow: 0 8px 0 #222;
      text-align: center;
      position: relative;
    }
    .top-controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
    }
    .bgm-btn {
      background: #f0f0f0;
      border: 2px solid #222;
      border-radius: 99px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      color: #333;
    }
    .bgm-btn.playing {
      background: #ffe3e8;
      color: #ff4d6d;
      border-color: #ff4d6d;
    }
    .sub-badge {
      display: inline-block;
      background: #ff4d6d;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 10px;
      border: 2px solid #222;
    }
    h1 {
      font-size: 1.3rem;
      line-height: 1.4;
      margin-bottom: 8px;
      color: #222;
    }
    p.desc {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .timer-display {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ff4d6d;
      margin-bottom: 10px;
      height: 30px;
    }
    .count-display {
      font-size: 0.9rem;
      font-weight: bold;
      color: #444;
      margin-bottom: 8px;
    }
    .meter-container {
      width: 100%;
      height: 26px;
      background: #eee;
      border-radius: 13px;
      border: 2px solid #222;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff758c, #ff4d6d);
      transition: width 0.06s ease;
    }
    .tap-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #ff4d6d;
      border: 3px solid #222;
      box-shadow: 0 6px 0 #222;
      font-size: 3.4rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tap-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #222;
    }
    .hint-text {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #888;
      font-weight: bold;
    }

    /* 結果モーダル（上部に寄せて連打位置と被らないように配置） */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      justify-content: center;
      align-items: flex-start;
      padding: 36px 20px 20px;
      z-index: 100;
    }
    .modal-card {
      background: #fff;
      padding: 22px 20px 26px;
      border-radius: 20px;
      border: 3px solid #222;
      box-shadow: 0 8px 0 #222;
      text-align: center;
      max-width: 320px;
      width: 100%;
      animation: slideDown 0.25s ease-out;
    }
    @keyframes slideDown {
      0% { transform: translateY(-20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .modal-top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }
    .close-btn {
      background: #222;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 99px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
      transition: opacity 0.2s;
    }
    .close-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .result-badge {
      display: inline-block;
      padding: 5px 16px;
      border-radius: 99px;
      background: #ffe3e8;
      color: #ff4d6d;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .time-record {
      font-size: 1.05rem;
      color: #555;
      margin-bottom: 16px;
    }
    .time-record span {
      font-weight: bold;
      color: #222;
      font-size: 1.45rem;
    }
    .message-box {
      background: #fafafa;
      border: 2px dashed #ff4d6d;
      border-radius: 12px;
      padding: 18px 14px;
    }
    .msg-text {
      font-size: 1.35rem;
      font-weight: bold;
      color: #222;
      margin-bottom: 10px;
    }
    .reward-text {
      font-size: 1.15rem;
      color: #ff4d6d;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 背景BGM（同じフォルダに bgm.mp3 を置くと自動でループ再生される） -->
  <audio id="bgmAudio" src="bgm.mp3" loop preload="auto" playsinline></audio>

  <div class="card">
    <div class="top-controls">
      <button type="button" class="bgm-btn" id="bgmToggleBtn" onclick="toggleBgm()">🎵 BGM: OFF</button>
    </div>

    <div class="sub-badge">✨ ゆいちゃん限定チャレンジ ✨</div>
    <h1>ゆうとの気持ち<br>つかみますゲーム</h1>
    <p class="desc">ハートを本気で連打して満タンにせよ！<br>クリアした速さでご褒美が変わるで！</p>

    <div class="timer-display" id="timerDisplay">READY...</div>
    <div class="count-display" id="countDisplay">残り 15 タップ！</div>

    <div class="meter-container">
      <div class="meter-bar" id="meter"></div>
    </div>

    <button type="button" class="tap-btn" id="tapButton" onclick="handleTap()">❤️</button>

    <div class="hint-text">▲ 2.5秒以内に叩き切れ！！🔊 ▲</div>
  </div>

  <!-- 結果モーダル -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-top-bar">
        <button type="button" class="close-btn" id="retryBtn" onclick="resetGame()" disabled>🔄 もう1回挑戦する</button>
      </div>

      <div class="result-badge" id="rankBadge">RANK S</div>
      <div class="time-record">クリアタイム: <span id="finalTime">0.00</span>秒</div>
      
      <div class="message-box">
        <div class="msg-text" id="resultMessage">メッセージ</div>
        <div class="reward-text" id="rewardMessage">🎁 ご褒美: ○○</div>
      </div>
    </div>
  </div>

  <script>
    var TARGET_TAPS = 15;
    var currentTaps = 0;
    var startTime = 0;
    var timerInterval = null;
    var isFinished = false;
    var audioCtx = null;
    var isBgmStarted = false;

    // BGMの設定（音量は0.15＝15%の小さめに設定）
    var bgm = document.getElementById('bgmAudio');
    bgm.volume = 0.15;

    function startBgmIfNeeded() {
      if (!isBgmStarted) {
        bgm.volume = 0.15;
        bgm.play().then(function() {
          isBgmStarted = true;
          updateBgmButton(true);
        }).catch(function(err) {
          // ファイルがまだ無い場合や自動再生制限時は無視
        });
      }
    }

    function toggleBgm() {
      bgm.volume = 0.15;
      if (bgm.paused) {
        bgm.play().then(function() {
          isBgmStarted = true;
          updateBgmButton(true);
        }).catch(function() {});
      } else {
        bgm.pause();
        updateBgmButton(false);
      }
    }

    function updateBgmButton(playing) {
      var btn = document.getElementById('bgmToggleBtn');
      if (playing) {
        btn.textContent = '🎵 BGM: ON';
        btn.classList.add('playing');
      } else {
        btn.textContent = '🎵 BGM: OFF';
        btn.classList.remove('playing');
      }
    }

    // ページ読み込み時にも一応自動再生を試みる
    window.addEventListener('DOMContentLoaded', function() {
      startBgmIfNeeded();
    });

    // 効果音シンセサイザー初期化
    function initAudio() {
      if (!audioCtx) {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // タップ時のポップ音
    function playTapSound(tapNum) {
      if (!audioCtx) return;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300 + (tapNum * 32), audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    // ランク別クリアサウンド
    function playClearSound(rankLevel) {
      if (!audioCtx) return;
      var notes = [];
      if (rankLevel === 3) {
        // SSSランク：超豪華ファンファーレ
        notes = [
          { f: 523.25, d: 0.08, t: 0.0, type: 'triangle' },
          { f: 659.25, d: 0.08, t: 0.09, type: 'triangle' },
          { f: 783.99, d: 0.08, t: 0.18, type: 'triangle' },
          { f: 1046.50, d: 0.12, t: 0.27, type: 'triangle' },
          { f: 783.99, d: 0.08, t: 0.40, type: 'triangle' },
          { f: 1046.50, d: 0.45, t: 0.50, type: 'triangle' }
        ];
      } else if (rankLevel === 2) {
        // Sランク：キラキラ4連音
        notes = [
          { f: 440.00, d: 0.1, t: 0.0, type: 'sine' },
          { f: 554.37, d: 0.1, t: 0.1, type: 'sine' },
          { f: 659.25, d: 0.1, t: 0.2, type: 'sine' },
          { f: 880.00, d: 0.35, t: 0.3, type: 'sine' }
        ];
      } else if (rankLevel === 1) {
        // Aランク：優しいピンポン♪
        notes = [
          { f: 523.25, d: 0.15, t: 0.0, type: 'sine' },
          { f: 659.25, d: 0.35, t: 0.16, type: 'sine' }
        ];
      } else {
        // Bランク（ご褒美なし）：残念なブザー音（プワワ〜ン）
        notes = [
          { f: 246.94, d: 0.18, t: 0.0, type: 'sawtooth' },
          { f: 196.00, d: 0.40, t: 0.20, type: 'sawtooth' }
        ];
      }

      notes.forEach(function(n) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = n.type;
        osc.frequency.setValueAtTime(n.f, audioCtx.currentTime + n.t);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime + n.t);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + n.t + n.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + n.t);
        osc.stop(audioCtx.currentTime + n.t + n.d);
      });
    }

    function handleTap() {
      if (isFinished) return;

      initAudio();
      startBgmIfNeeded();

      // 初回タップでタイマースタート
      if (currentTaps === 0) {
        startTime = Date.now();
        timerInterval = setInterval(function() {
          var elapsed = (Date.now() - startTime) / 1000;
          document.getElementById('timerDisplay').textContent = elapsed.toFixed(2) + '秒';
        }, 30);
      }

      currentTaps++;
      playTapSound(currentTaps);

      var remaining = Math.max(TARGET_TAPS - currentTaps, 0);
      document.getElementById('countDisplay').textContent = '残り ' + remaining + ' タップ！';

      var percent = Math.min((currentTaps / TARGET_TAPS) * 100, 100);
      document.getElementById('meter').style.width = percent + '%';

      // クリア判定
      if (currentTaps >= TARGET_TAPS) {
        isFinished = true;
        clearInterval(timerInterval);
        var totalTime = (Date.now() - startTime) / 1000;
        document.getElementById('timerDisplay').textContent = totalTime.toFixed(2) + '秒';
        document.getElementById('countDisplay').textContent = '満タン達成！！🎉';

        var rank = '';
        var msg = '';
        var reward = '';
        var rankLevel = 0;

        if (totalTime < 2.00) {
          // 2.00秒未満：SSSランク
          rank = 'RANK SSS 🔥';
          msg = '特別やで';
          reward = '🎁 ご褒美: 添い寝';
          rankLevel = 3;
        } else if (totalTime < 2.25) {
          // 2.00秒〜2.25秒未満：Sランク
          rank = 'RANK S ✨';
          msg = 'こっちこいよ';
          reward = '🎁 ご褒美: ハグ';
          rankLevel = 2;
        } else if (totalTime < 2.50) {
          // 2.25秒〜2.50秒未満：Aランク（2.5秒未満でナデナデ！）
          rank = 'RANK A 👍';
          msg = 'よく頑張ったね！';
          reward = '🎁 ご褒美: ナデナデ';
          rankLevel = 1;
        } else {
          // 2.50秒以上（3秒以上含む）：ご褒美なし！
          rank = 'RANK B 💦';
          msg = 'やる気出そうぜ';
          reward = '🎁 ご褒美: なし';
          rankLevel = 0;
        }

        document.getElementById('rankBadge').textContent = rank;
        document.getElementById('finalTime').textContent = totalTime.toFixed(2);
        document.getElementById('resultMessage').textContent = msg;
        document.getElementById('rewardMessage').textContent = reward;

        setTimeout(function() {
          playClearSound(rankLevel);
        }, 100);

        var retryBtn = document.getElementById('retryBtn');
        retryBtn.disabled = true;

        setTimeout(function() {
          document.getElementById('modal').style.display = 'flex';
          setTimeout(function() {
            retryBtn.disabled = false;
          }, 1000);
        }, 120);
      }
    }

    function resetGame() {
      currentTaps = 0;
      startTime = 0;
      isFinished = false;
      clearInterval(timerInterval);
      document.getElementById('timerDisplay').textContent = 'READY...';
      document.getElementById('countDisplay').textContent = '残り ' + TARGET_TAPS + ' タップ！';
      document.getElementById('meter').style.width = '0%';
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
